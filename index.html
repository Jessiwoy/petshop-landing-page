<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PetCare | Cuidado e conforto para o seu pet</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/globals.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/sections.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

  <!-- Header/Navbar -->
  <header class="header">
    <div class="container">
      <nav class="navbar">
        <a href="#" class="logo">PetCare</a>

        <ul class="nav-links">
          <li><a href="#">Início</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Serviços</a></li>
          <li><a href="#">Contato</a></li>
        </ul>

        <a href="#" class="btn btn-primary">
          Agendar
        </a>
      </nav>
    </div>
  </header>

  <main>

    <!-- Hero -->
    <section class="hero">
      <div class="container">
        <div class="hero-content">

          <div class="hero-text">
            <span class="section-tag">
              Bem-vindo à PetCare
            </span>

            <h1>
              Cuidado, conforto e felicidade para o seu melhor amigo.
            </h1>

            <p>
              Serviços completos para garantir bem-estar,
              saúde e carinho em cada atendimento.
            </p>

            <div class="hero-actions">
              <a href="#" class="btn btn-primary">
                Agendar consulta
              </a>

              <a href="#" class="btn btn-secondary">
                Conhecer serviços
              </a>
            </div>
          </div>

          <div class="hero-image">
            <img
              src="./assets/images/hero-pet.jpg"
              alt="Cachorro feliz"
            >
          </div>

        </div>
      </div>
    </section>

    <!-- Sobre -->
    <section class="about"></section>

    <!-- Serviços -->
    <section class="services"></section>

    <!-- Diferenciais -->
    <section class="differentials"></section>

    <!-- Depoimentos -->
    <section class="testimonials"></section>

    <!-- FAQ -->
    <section class="faq"></section>

    <!-- Contato -->
    <section class="contact"></section>

  </main>

  <!-- Footer -->
  <footer class="footer"></footer>

  <!-- Scripts -->
  <script src="./js/main.js"></script>
</body>
</html>
